<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finanzas del Hogar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#2563eb', 600: '#1d4ed8' }
          }
        }
      }
    }
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS & jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    @media (max-width: 640px) {
      .tap-target { min-height: 48px; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
  <div id="app" class="min-h-full flex flex-col"></div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://ioagcqakgsldsxzualea.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bfGeIRo6S-dYpmi-nVWNrg_xFSab8kv";
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. ESTADO GLOBAL
    // ==========================================
    const state = {
      user: JSON.parse(localStorage.getItem('hogar_user')) || null,
      darkMode: localStorage.getItem('hogar_dark') === 'true',
      view: 'dashboard', // dashboard | members | incomes | reports
      categories: [],
      members: [],
      expenses: [],
      incomes: [],
      loading: false,
      filter: { range: 'this_month', memberId: 'all', catId: 'all' }
    };

    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      localStorage.setItem('hogar_dark', state.darkMode);
      document.documentElement.classList.toggle('dark', state.darkMode);
      renderApp();
    }

    if (state.darkMode) document.documentElement.classList.add('dark');

    // ==========================================
    // 3. CARGA DE DATOS CENTRALIZADA
    // ==========================================
    async function fetchData() {
      if (!state.user) return;
      state.loading = true;
      try {
        const [catRes, userRes, expRes, incRes] = await Promise.all([
          sbClient.from('categorias').select('*').order('nombre'),
          sbClient.from('usuarios').select('*').order('nombre'),
          sbClient.from('gastos').select('*, usuarios(nombre, username), categorias(nombre, color, icono)').order('fecha', { ascending: false }).order('created_at', { ascending: false }),
          sbClient.from('ingresos').select('*').order('fecha', { ascending: false }).order('created_at', { ascending: false })
        ]);

        state.categories = catRes.data || [];
        state.members = userRes.data || [];
        state.expenses = expRes.data || [];
        state.incomes = incRes.data || [];

        const freshMe = state.members.find(m => m.id === state.user.id);
        if (freshMe) {
          state.user = freshMe;
          localStorage.setItem('hogar_user', JSON.stringify(freshMe));
        }
      } catch (err) {
        console.error("Error al cargar datos:", err);
      } finally {
        state.loading = false;
        renderApp();
      }
    }

    // ==========================================
    // 4. AUTENTICACIÓN
    // ==========================================
    async function handleLogin(e) {
      e.preventDefault();
      const username = e.target.username.value.trim().toLowerCase().replace('@', '');
      const pin = e.target.pin.value.trim();
      const errorEl = document.getElementById('login-error');
      if (errorEl) errorEl.classList.add('hidden');

      try {
        const pinHash = await sha256(pin);
        const { data, error } = await sbClient
          .from('usuarios')
          .select('*')
          .eq('username', username)
          .eq('pin_hash', pinHash)
          .single();

        if (error || !data) {
          if (errorEl) {
            errorEl.textContent = 'Usuario o PIN incorrecto';
            errorEl.classList.remove('hidden');
          }
          return;
        }

        if (data.esta_bloqueado) {
          if (errorEl) {
            errorEl.textContent = 'Este usuario se encuentra bloqueado.';
            errorEl.classList.remove('hidden');
          }
          return;
        }

        state.user = data;
        localStorage.setItem('hogar_user', JSON.stringify(data));
        state.view = 'dashboard';
        await fetchData();
      } catch (err) {
        if (errorEl) {
          errorEl.textContent = 'Error de conexión con la base de datos';
          errorEl.classList.remove('hidden');
        }
      }
    }

    function handleLogout() {
      state.user = null;
      localStorage.removeItem('hogar_user');
      state.view = 'dashboard';
      renderApp();
    }

    // ==========================================
    // 5. INTERFAZ Y RENDERIZADO
    // ==========================================
    function switchView(viewName) {
      state.view = viewName;
      renderApp();
    }

    function renderNavigationTabs() {
      return `
        <div class="flex items-center space-x-2 mb-6 border-b border-slate-200 dark:border-slate-800 pb-3 overflow-x-auto">
          <button type="button" onclick="switchView('dashboard')" class="px-4 py-2 rounded-xl font-medium text-sm whitespace-nowrap transition-colors ${state.view === 'dashboard' ? 'bg-brand-500 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            Dashboard
          </button>
          ${state.user.rol === 'admin' ? `
            <button type="button" onclick="switchView('incomes')" class="px-4 py-2 rounded-xl font-medium text-sm whitespace-nowrap transition-colors ${state.view === 'incomes' ? 'bg-brand-500 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
              Gestión Ingresos
            </button>
            <button type="button" onclick="switchView('members')" class="px-4 py-2 rounded-xl font-medium text-sm whitespace-nowrap transition-colors ${state.view === 'members' ? 'bg-brand-500 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
              Gestión Miembros
            </button>
          ` : ''}
          <button type="button" onclick="switchView('reports')" class="px-4 py-2 rounded-xl font-medium text-sm whitespace-nowrap transition-colors ${state.view === 'reports' ? 'bg-brand-500 text-white shadow-sm' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            Reportes y Exportación
          </button>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!state.user) {
        root.innerHTML = renderLoginView();
      } else {
        root.innerHTML = `
          ${renderHeader()}
          <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 pb-24">
            ${renderNavigationTabs()}
            ${state.view === 'dashboard' ? renderDashboard() : ''}
            ${state.view === 'incomes' && state.user.rol === 'admin' ? renderIncomesView() : ''}
            ${state.view === 'members' && state.user.rol === 'admin' ? renderMembersView() : ''}
            ${state.view === 'reports' ? renderReportsView() : ''}
          </main>
          ${renderBottomNav()}
          ${renderModals()}
        `;
        if (state.view === 'reports') {
          postRenderCharts();
        }
      }
      lucide.createIcons();
    }

    function renderHeader() {
      return `
        <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-4 py-3 sm:px-6 flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-3">
            <div class="p-2 bg-brand-500 rounded-xl text-white shadow-sm">
              <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <div>
              <h1 class="text-base font-bold leading-tight">Finanzas del Hogar</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">${state.user.nombre} • <span class="capitalize font-semibold text-brand-500">${state.user.rol === 'admin' ? 'Administrador' : 'Miembro'}</span></p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="toggleDarkMode()" title="Cambiar tema" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
              <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="w-5 h-5"></i>
            </button>
            <button onclick="handleLogout()" title="Cerrar sesión" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition-colors">
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </header>
      `;
    }

    function renderBottomNav() {
      return `
        <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around p-2 z-30 shadow-lg">
          <button type="button" onclick="switchView('dashboard')" class="flex flex-col items-center text-xs p-1 ${state.view === 'dashboard' ? 'text-brand-500 font-bold' : 'text-slate-500'}">
            <i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i> Resumen
          </button>
          ${state.user.rol === 'admin' ? `
            <button type="button" onclick="switchView('incomes')" class="flex flex-col items-center text-xs p-1 ${state.view === 'incomes' ? 'text-brand-500 font-bold' : 'text-slate-500'}">
              <i data-lucide="arrow-down-left" class="w-5 h-5 mb-0.5"></i> Ingresos
            </button>
            <button type="button" onclick="switchView('members')" class="flex flex-col items-center text-xs p-1 ${state.view === 'members' ? 'text-brand-500 font-bold' : 'text-slate-500'}">
              <i data-lucide="users" class="w-5 h-5 mb-0.5"></i> Miembros
            </button>
          ` : ''}
          <button type="button" onclick="switchView('reports')" class="flex flex-col items-center text-xs p-1 ${state.view === 'reports' ? 'text-brand-500 font-bold' : 'text-slate-500'}">
            <i data-lucide="bar-chart-3" class="w-5 h-5 mb-0.5"></i> Reportes
          </button>
        </nav>
      `;
    }

    // --- DASHBOARD ---
    function renderDashboard() {
      const totalIngresos = state.incomes.reduce((acc, i) => acc + Number(i.monto), 0);
      const totalGastos = state.expenses.reduce((acc, g) => acc + Number(g.monto), 0);
      const totalCreditos = state.members.reduce((acc, m) => acc + Number(m.credito_asignado), 0);
      const saldoCajaReal = totalIngresos - totalGastos;
      const fondoLibre = totalIngresos - totalCreditos;

      const misGastos = state.expenses.filter(g => g.usuario_id === state.user.id);
      const totalGastadoPersonal = misGastos.reduce((acc, g) => acc + Number(g.monto), 0);
      const creditoPersonal = Number(state.user.credito_asignado || 0);
      const saldoDisponiblePersonal = creditoPersonal - totalGastadoPersonal;
      const pctConsumido = creditoPersonal > 0 ? Math.min(100, Math.round((totalGastadoPersonal / creditoPersonal) * 100)) : 0;

      let colorBarra = 'bg-emerald-500';
      if (pctConsumido > 70) colorBarra = 'bg-amber-500';
      if (pctConsumido > 90 || saldoDisponiblePersonal < 0) colorBarra = 'bg-rose-500';

      return `
        ${state.user.rol === 'member' ? `
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 mb-6 shadow-sm">
            <div class="flex justify-between items-start mb-3">
              <div>
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tu Presupuesto Asignado</span>
                <h3 class="text-2xl font-black mt-0.5 ${saldoDisponiblePersonal < 0 ? 'text-rose-600 dark:text-rose-400' : ''}">
                  Bs. ${saldoDisponiblePersonal.toFixed(2)}
                </h3>
                <p class="text-xs text-slate-500">
                  ${saldoDisponiblePersonal < 0 ? '⚠️ Has superado tu límite asignado' : `Disponible de Bs. ${creditoPersonal.toFixed(2)}`}
                </p>
              </div>
              <button onclick="openModal('modal-gasto')" class="tap-target bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center shadow-sm">
                <i data-lucide="plus" class="w-4 h-4 mr-1"></i> Registrar Gasto
              </button>
            </div>
            <div class="space-y-1">
              <div class="flex justify-between text-xs font-medium text-slate-500">
                <span>Gastado: Bs. ${totalGastadoPersonal.toFixed(2)}</span>
                <span>${pctConsumido}%</span>
              </div>
              <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                <div class="${colorBarra} h-full transition-all duration-300" style="width: ${Math.min(100, pctConsumido)}%"></div>
              </div>
            </div>
          </div>
        ` : ''}

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-6">
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span class="text-xs text-slate-500">Saldo Real en Caja</span>
            <p class="text-lg sm:text-xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">Bs. ${saldoCajaReal.toFixed(2)}</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span class="text-xs text-slate-500">Fondo sin Asignar</span>
            <p class="text-lg sm:text-xl font-bold ${fondoLibre >= 0 ? 'text-blue-600 dark:text-blue-400' : 'text-rose-500'} mt-1">Bs. ${fondoLibre.toFixed(2)}</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span class="text-xs text-slate-500">Ingresos Totales</span>
            <p class="text-lg sm:text-xl font-bold mt-1">Bs. ${totalIngresos.toFixed(2)}</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span class="text-xs text-slate-500">Gastos Totales</span>
            <p class="text-lg sm:text-xl font-bold text-rose-600 dark:text-rose-400 mt-1">Bs. ${totalGastos.toFixed(2)}</p>
          </div>
        </div>

        ${state.user.rol === 'admin' ? `
          <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="openModal('modal-ingreso')" class="tap-target bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center shadow-sm">
              <i data-lucide="arrow-down-left" class="w-4 h-4 mr-1.5"></i> Registrar Ingreso Central
            </button>
            <button onclick="openModal('modal-gasto')" class="tap-target bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center shadow-sm">
              <i data-lucide="arrow-up-right" class="w-4 h-4 mr-1.5"></i> Registrar Consumo
            </button>
            <button onclick="resetSystem()" class="tap-target ml-auto text-xs text-slate-400 hover:text-red-500 p-2">
              Reiniciar Sistema
            </button>
          </div>
        ` : ''}

        <!-- Lista de Últimos Consumos con Edición / Eliminación -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 sm:p-5 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-sm">Últimos Consumos Registrados</h3>
            <span class="text-xs text-slate-400">Puedes editar o borrar tus registros</span>
          </div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800">
            ${state.expenses.slice(0, 15).map(g => {
              const puedeGestionar = state.user.rol === 'admin' || g.usuario_id === state.user.id;
              return `
                <div class="py-3 flex items-center justify-between group">
                  <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white shrink-0" style="background-color: ${g.categorias?.color || '#6b7280'}">
                      <i data-lucide="${g.categorias?.icono || 'tag'}" class="w-4 h-4"></i>
                    </div>
                    <div>
                      <p class="text-sm font-medium leading-none text-slate-800 dark:text-slate-200">${g.descripcion}</p>
                      <span class="text-xs text-slate-400">${g.usuarios?.nombre || 'Desconocido'} • ${g.categorias?.nombre || 'General'} • ${g.fecha}</span>
                    </div>
                  </div>
                  <div class="flex items-center space-x-2">
                    <span class="font-bold text-sm text-rose-600 mr-1">-Bs. ${Number(g.monto).toFixed(2)}</span>
                    ${puedeGestionar ? `
                      <button onclick="openModalEditarGasto('${g.id}')" title="Editar Gasto" class="p-1.5 text-slate-400 hover:text-blue-500 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                      </button>
                      <button onclick="eliminarGasto('${g.id}')" title="Eliminar Gasto" class="p-1.5 text-slate-400 hover:text-rose-500 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('') || '<p class="text-sm text-slate-400 py-4 text-center">No hay gastos registrados aún</p>'}
          </div>
        </div>
      `;
    }

    // --- GESTIÓN DE INGRESOS (SOLO ADMIN) ---
    function renderIncomesView() {
      return `
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-bold">Gestión de Ingresos</h2>
            <p class="text-xs text-slate-500">Historial completo del fondo central con opción de edición y corrección</p>
          </div>
          <button onclick="openModal('modal-ingreso')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center shadow-sm">
            <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> Nuevo Ingreso
          </button>
        </div>

        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 text-xs text-slate-500">
                <tr>
                  <th class="p-3.5">Fecha</th>
                  <th class="p-3.5">Fuente / Origen</th>
                  <th class="p-3.5">Descripción</th>
                  <th class="p-3.5 text-right">Monto (Bs.)</th>
                  <th class="p-3.5 text-center">Acciones</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${state.incomes.map(inc => `
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                    <td class="p-3.5 text-xs text-slate-400">${inc.fecha}</td>
                    <td class="p-3.5 font-medium text-slate-800 dark:text-slate-200">${inc.fuente}</td>
                    <td class="p-3.5 text-slate-600 dark:text-slate-400">${inc.descripcion}</td>
                    <td class="p-3.5 font-bold text-right text-emerald-600 dark:text-emerald-400">+Bs. ${Number(inc.monto).toFixed(2)}</td>
                    <td class="p-3.5 text-center whitespace-nowrap">
                      <button onclick="openModalEditarIngreso('${inc.id}')" title="Editar Ingreso" class="p-1.5 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-950/40 rounded inline-flex items-center text-xs mr-1">
                        <i data-lucide="pencil" class="w-3.5 h-3.5 mr-0.5"></i> Editar
                      </button>
                      <button onclick="eliminarIngreso('${inc.id}')" title="Eliminar Ingreso" class="p-1.5 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded inline-flex items-center text-xs">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-0.5"></i> Borrar
                      </button>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="5" class="text-center text-slate-400 py-6">No hay ingresos registrados</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- GESTIÓN DE MIEMBROS ---
    function renderMembersView() {
      return `
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-bold">Gestión de Usuarios</h2>
            <p class="text-xs text-slate-500">Administra cuentas, nombres, contraseñas y saldos</p>
          </div>
          <button onclick="openModal('modal-crear-usuario')" class="bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center shadow-sm">
            <i data-lucide="user-plus" class="w-4 h-4 mr-1.5"></i> Nuevo Usuario
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${state.members.map(m => {
            const gastado = state.expenses.filter(g => g.usuario_id === m.id).reduce((a, b) => a + Number(b.monto), 0);
            const disponible = Number(m.credito_asignado) - gastado;
            return `
              <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 flex flex-col justify-between shadow-sm">
                <div>
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="font-bold text-base text-slate-900 dark:text-slate-100">${m.nombre}</h4>
                      <p class="text-xs text-slate-400">@${m.username} • <span class="uppercase font-semibold text-brand-500">${m.rol}</span></p>

    function getFilteredExpenses() {
      return state.expenses.filter(g => {
        if (state.filter.range === 'this_month') {
          const now = new Date();
          const gDate = new Date(g.fecha);
          if (gDate.getMonth() !== now.getMonth() || gDate.getFullYear() !== now.getFullYear()) return false;
        } else if (state.filter.range === 'last_7') {
          const diffDays = (new Date() - new Date(g.fecha)) / (1000 * 3600 * 24);
          if (diffDays > 7) return false;
        }

        if (state.filter.memberId !== 'all' && g.usuario_id !== state.filter.memberId) return false;
        if (state.filter.catId !== 'all' && g.categoria_id !== state.filter.catId) return false;

        return true;
      });
    }

    function updateFilters() {
      state.filter.range = document.getElementById('filter-range').value;
      state.filter.memberId = document.getElementById('filter-member').value;
      state.filter.catId = document.getElementById('filter-cat').value;
      renderApp();
    }

    function postRenderCharts() {
      const filtered = getFilteredExpenses();

      const catMap = {};
      state.categories.forEach(c => catMap[c.nombre] = { total: 0, color: c.color });
      filtered.forEach(g => {
        const catName = g.categorias?.nombre || 'Otros';
        if (catMap[catName]) catMap[catName].total += Number(g.monto);
      });

      const catLabels = Object.keys(catMap).filter(k => catMap[k].total > 0);
      const catData = catLabels.map(k => catMap[k].total);
      const catColors = catLabels.map(k => catMap[k].color);

      const ctxCat = document.getElementById('chartCategorias');
      if (ctxCat) {
        if (window.myChartCat) window.myChartCat.destroy();
        window.myChartCat = new Chart(ctxCat, {
          type: 'doughnut',
          data: {
            labels: catLabels.length ? catLabels : ['Sin datos'],
            datasets: [{ 
              data: catData.length ? catData : [1], 
              backgroundColor: catColors.length ? catColors : ['#cbd5e1'] 
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const memMap = {};
      state.members.forEach(m => memMap[m.nombre] = 0);
      filtered.forEach(g => {
        const memName = g.usuarios?.nombre || 'Desconocido';
        if (memMap[memName] !== undefined) memMap[memName] += Number(g.monto);
      });

      const ctxMem = document.getElementById('chartMiembros');
      if (ctxMem) {
        if (window.myChartMem) window.myChartMem.destroy();
        window.myChartMem = new Chart(ctxMem, {
          type: 'bar',
          data: {
            labels: Object.keys(memMap),
            datasets: [{
              label: 'Total Gastado (Bs.)',
              data: Object.values(memMap),
              backgroundColor: '#3b82f6'
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

                  <option value="member">Miembro</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('modal-crear-usuario')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-500">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white">Crear Usuario</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Modal Editar Usuario -->
        <div id="modal-editar-usuario" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-md p-5 border border-slate-200 dark:border-slate-800 shadow-xl">
            <h3 class="font-bold text-lg mb-1">Editar Usuario</h3>
            <p class="text-xs text-slate-400 mb-4">Modifica los datos del usuario o reasigna su PIN</p>
            <form onsubmit="handleActualizarUsuario(event)" class="space-y-4">
              <input type="hidden" id="edit-user-id" name="user_id" />
              <div>
                <label class="text-xs font-semibold text-slate-500">Nombre Completo</label>
                <input id="edit-nombre" name="nombre" type="text" required class="w-full mt-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-500">Nombre de Usuario (sin @)</label>
                <input id="edit-username" name="username" type="text" autocapitalize="none" required class="w-full mt-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-500">Nuevo PIN (4 dígitos - dejar vacío para mantener)</label>
                <input id="edit-pin" name="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" class="w-full mt-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm tracking-widest text-center" />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-500">Rol</label>
                <select id="edit-rol" name="rol" class="w-full mt-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                  <option value="member">Miembro</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              <div id="edit-user-error" class="hidden text-xs text-rose-500 font-medium"></div>
              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('modal-editar-usuario')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-500">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white">Guardar Cambios</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Modal Recargar Saldo -->
        <div id="modal-recargar" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-sm p-5 border border-slate-200 dark:border-slate-800 shadow-xl">
            <h3 class="font-bold text-base mb-1">Asignar / Recargar Crédito</h3>
            <p id="recargar-nombre" class="text-xs text-slate-400 mb-4"></p>
            <form onsubmit="handleAsignarCredito(event)" class="space-y-4">
              <input type="hidden" id="recargar-user-id" name="user_id" />
              <div>
                <label class="text-xs font-semibold text-slate-500">Nuevo Presupuesto Total (Bs.)</label>
                <input name="credito" type="number" step="0.01" required min="0" class="w-full mt-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-lg font-bold" />
              </div>
              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="closeModal('modal-recargar')" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-500">Cancelar</button>
                <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white">Actualizar</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // --- ADVERTENCIA EN TIEMPO REAL ---
    function checkAdvertenciaSaldo(montoStr) {
      const monto = parseFloat(montoStr) || 0;
      const warnEl = document.getElementById('gasto-warning');
      if (!warnEl) return;

      if (state.user.rol === 'member') {
        const misGastos = state.expenses.filter(g => g.usuario_id === state.user.id);
        const totalGastado = misGastos.reduce((acc, g) => acc + Number(g.monto), 0);
        const disponible = Number(state.user.credito_asignado || 0) - totalGastado;

        if (monto > disponible) {
          warnEl.classList.remove('hidden');
        } else {
          warnEl.classList.add('hidden');
        }
      }
    }

    // --- GASTOS: GUARDAR, EDITAR Y BORRAR ---
    async function handleGuardarGasto(e) {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('gasto-error');
      if (errorEl) errorEl.classList.add('hidden');

      const payload = {
        p_usuario_id: state.user.id,
        p_categoria_id: form.categoria_id.value,
        p_monto: parseFloat(form.monto.value),
        p_descripcion: form.descripcion.value.trim(),
        p_fecha: form.fecha.value
      };

      const { data, error } = await sbClient.rpc('registrar_gasto_con_validacion', payload);

      if (error || (data && !data.success)) {
        if (errorEl) {
          errorEl.textContent = data ? data.message : 'Error al registrar el consumo';
          errorEl.classList.remove('hidden');
        }
        return;
      }

      if (data && data.sobregiro) {
        alert(data.message);
      }

      closeModal('modal-gasto');
      await fetchData();
    }

    function openModalEditarGasto(id) {
      const g = state.expenses.find(item => item.id === id);
      if (!g) return;
      document.getElementById('edit-gasto-id').value = g.id;
      document.getElementById('edit-gasto-monto').value = g.monto;
      document.getElementById('edit-gasto-cat').value = g.categoria_id;
      document.getElementById('edit-gasto-desc').value = g.descripcion;
      document.getElementById('edit-gasto-fecha').value = g.fecha;
      const err = document.getElementById('edit-gasto-error');
      if (err) err.classList.add('hidden');
      openModal('modal-editar-gasto');
    }

    async function handleActualizarGasto(e) {
      e.preventDefault();
      const form = e.target;
      const id = form.gasto_id.value;
      const monto = parseFloat(form.monto.value);
      const categoria_id = form.categoria_id.value;
      const descripcion = form.descripcion.value.trim();
      const fecha = form.fecha.value;

      const { error } = await sbClient.from('gastos').update({
        monto, categoria_id, descripcion, fecha
      }).eq('id', id);

      if (error) {
        const err = document.getElementById('edit-gasto-error');
        if (err) {
          err.textContent = 'Error al actualizar gasto: ' + error.message;
          err.classList.remove('hidden');
        }
        return;
      }

      closeModal('modal-editar-gasto');
      await fetchData();
    }

    async function eliminarGasto(id) {
      if (confirm('¿Deseas eliminar este registro de gasto?')) {
        const { error } = await sbClient.from('gastos').delete().eq('id', id);
        if (error) {
          alert('Error al eliminar: ' + error.message);
        } else {
          await fetchData();
        }
      }
    }

    // --- INGRESOS: GUARDAR, EDITAR Y BORRAR ---
    async function handleGuardarIngreso(e) {
      e.preventDefault();
      const form = e.target;
      await sbClient.from('ingresos').insert([{
        monto: parseFloat(form.monto.value),
        fuente: form.fuente.value.trim(),
        descripcion: form.descripcion.value.trim(),
        fecha: form.fecha.value
      }]);
      closeModal('modal-ingreso');
      await fetchData();
    }

    function openModalEditarIngreso(id) {
      const inc = state.incomes.find(item => item.id === id);
      if (!inc) return;
      document.getElementById('edit-ingreso-id').value = inc.id;
      document.getElementById('edit-ingreso-monto').value = inc.monto;
      document.getElementById('edit-ingreso-fuente').value = inc.fuente;
      document.getElementById('edit-ingreso-desc').value = inc.descripcion;
      document.getElementById('edit-ingreso-fecha').value = inc.fecha;
      const err = document.getElementById('edit-ingreso-error');
      if (err) err.classList.add('hidden');
      openModal('modal-editar-ingreso');
    }

    async function handleActualizarIngreso(e) {
      e.preventDefault();
      const form = e.target;
      const id = form.ingreso_id.value;
      const monto = parseFloat(form.monto.value);
      const fuente = form.fuente.value.trim();
      const descripcion = form.descripcion.value.trim();
      const fecha = form.fecha.value;

      const { error } = await sbClient.from('ingresos').update({
        monto, fuente, descripcion, fecha
      }).eq('id', id);

      if (error) {
        const err = document.getElementById('edit-ingreso-error');
        if (err) {
          err.textContent = 'Error al actualizar ingreso: ' + error.message;
          err.classList.remove('hidden');
        }
        return;
      }

      closeModal('modal-editar-ingreso');
      await fetchData();
    }

    async function eliminarIngreso(id) {
      if (confirm('¿Deseas eliminar este registro de ingreso?')) {
        const { error } = await sbClient.from('ingresos').delete().eq('id', id);
        if (error) {
          alert('Error al eliminar: ' + error.message);
        } else {
          await fetchData();
        }
      }
    }

    // --- USUARIOS ---
    async function handleGuardarUsuario(e) {
      e.preventDefault();
      const form = e.target;
      const pinHash = await sha256(form.pin.value.trim());

      await sbClient.from('usuarios').insert([{
        nombre: form.nombre.value.trim(),
        username: form.username.value.trim().toLowerCase(),
        pin_hash: pinHash,
        rol: form.rol.value,
        credito_asignado: 0.00
      }]);
      closeModal('modal-crear-usuario');
      await fetchData();
    }

    function openModalEditarUsuario(id) {
      const u = state.members.find(m => m.id === id);
      if (!u) return;
      document.getElementById('edit-user-id').value = u.id;
      document.getElementById('edit-nombre').value = u.nombre;
      document.getElementById('edit-username').value = u.username;
      document.getElementById('edit-rol').value = u.rol;
      document.getElementById('edit-pin').value = '';
      const err = document.getElementById('edit-user-error');
      if (err) err.classList.add('hidden');
      openModal('modal-editar-usuario');
    }

    async function handleActualizarUsuario(e) {
      e.preventDefault();
      const form = e.target;
      const id = form.user_id.value;
      const nombre = form.nombre.value.trim();
      const username = form.username.value.trim().toLowerCase();
      const rol = form.rol.value;
      const pin = form.pin.value.trim();
      const err = document.getElementById('edit-user-error');

      const updateData = { nombre, username, rol };
      if (pin.length > 0) {
        if (pin.length !== 4) {
          if (err) {
            err.textContent = 'El PIN debe contener exactamente 4 dígitos';
            err.classList.remove('hidden');
          }
          return;
        }
        updateData.pin_hash = await sha256(pin);
      }

      const { error } = await sbClient.from('usuarios').update(updateData).eq('id', id);
      if (error) {
        if (err) {
          err.textContent = 'Error al actualizar usuario: ' + error.message;
          err.classList.remove('hidden');
        }
        return;
      }

      closeModal('modal-editar-usuario');
      await fetchData();
    }

    async function handleAsignarCredito(e) {
      e.preventDefault();
      const form = e.target;
      await sbClient.from('usuarios')
        .update({ credito_asignado: parseFloat(form.credito.value) })
        .eq('id', form.user_id.value);

      closeModal('modal-recargar');
      await fetchData();
    }

    async function toggleBloqueoUsuario(id, estadoActual) {
      await sbClient.from('usuarios').update({ esta_bloqueado: !estadoActual }).eq('id', id);
      await fetchData();
    }

    async function eliminarUsuario(id) {
      if (confirm('¿Seguro que deseas eliminar este usuario? Sus consumos asociados también se desvincularán.')) {
        await sbClient.from('usuarios').delete().eq('id', id);
        await fetchData();
      }
    }

    async function resetSystem() {
      if (confirm('ADVERTENCIA: Se borrarán todos los ingresos y gastos registrados en la base de datos. ¿Deseas continuar?')) {
        await Promise.all([
          sbClient.from('gastos').delete().neq('monto', -1),
          sbClient.from('ingresos').delete().neq('monto', -1)
        ]);
        await fetchData();
      }
    }

    // --- UTILIDADES ---
    function openModal(id) { 
      const el = document.getElementById(id);
      if (el) el.classList.remove('hidden'); 
    }
    function closeModal(id) { 
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden'); 
    }
    function openModalRecargar(id, nombre) {
      document.getElementById('recargar-user-id').value = id;
      document.getElementById('recargar-nombre').textContent = 'Usuario: ' + nombre;
      openModal('modal-recargar');
    }

    // --- EXPORTACIONES ---
    function exportToExcel() {
      const rows = getFilteredExpenses().map(g => ({
        Fecha: g.fecha,
        Miembro: g.usuarios?.nombre,
        Categoría: g.categorias?.nombre,
        Descripción: g.descripcion,
        'Monto (Bs.)': Number(g.monto)
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Gastos");
      XLSX.writeFile(wb, "Reporte_Gastos_Hogar.xlsx");
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("Reporte de Gastos del Hogar", 14, 15);

      const tableData = getFilteredExpenses().map(g => [
        g.fecha,
        g.usuarios?.nombre || 'N/A',
        g.categorias?.nombre || 'General',
        g.descripcion,
        `Bs. ${Number(g.monto).toFixed(2)}`
      ]);

      doc.autoTable({
        head: [['Fecha', 'Miembro', 'Categoría', 'Descripción', 'Monto']],
        body: tableData,
        startY: 20
      });

      doc.save("Reporte_Gastos_Hogar.pdf");
    }

    // --- PANTALLA LOGIN ---
    function renderLoginView() {
      return `
        <div class="flex-1 flex items-center justify-center p-4">
          <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl">
            <div class="text-center mb-6">
              <div class="w-12 h-12 bg-brand-500 rounded-2xl mx-auto flex items-center justify-center text-white mb-3 shadow-md">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
              </div>
              <h2 class="text-xl font-bold">Economía Familiar</h2>
              <p class="text-xs text-slate-400 mt-1">Inicia sesión con tu usuario y PIN</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="text-xs font-semibold text-slate-500">Usuario</label>
                <div class="relative mt-1">
                  <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">@</span>
                  <input name="username" type="text" autocapitalize="none" autocorrect="off" required placeholder="ej. usuario" class="w-full pl-8 pr-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
                </div>
              </div>

              <div>
                <label class="text-xs font-semibold text-slate-500">PIN de 4 dígitos</label>
                <input name="pin" type="password" inputmode="numeric" maxlength="4" required placeholder="••••" class="w-full mt-1 py-2.5 text-center tracking-widest text-lg rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div id="login-error" class="hidden text-xs text-rose-500 font-medium text-center"></div>

              <button type="submit" class="w-full tap-target py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl text-sm transition-all shadow-md mt-2">
                Ingresar al Sistema
              </button>
            </form>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 6. INICIALIZACIÓN
    // ==========================================
    renderApp();
    if (state.user) {
      fetchData();
    }
  </script>
</body>
</html>
